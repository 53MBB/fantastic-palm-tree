name: Build MAGGuilds 4.0.26

on:
  push:
    branches: [magguilds-4.0.26-rewrite]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build with Maven
        run: mvn -B clean package
      - name: Verify JAR
        run: |
          test -f target/MAGGuilds-4.0.26.jar
          jar tf target/MAGGuilds-4.0.26.jar | grep -q 'pl/maghub/guilds/MAGGuildsPlugin.class'
          jar tf target/MAGGuilds-4.0.26.jar | grep -q 'plugin.yml'
      - name: Create source archive
        run: zip -qr target/MAGGuilds-4.0.26-source.zip pom.xml README.md src .github/workflows/build-magguilds-4.0.26.yml
      - name: Checksums
        run: |
          sha256sum target/MAGGuilds-4.0.26.jar > target/MAGGuilds-4.0.26.jar.sha256
          sha256sum target/MAGGuilds-4.0.26-source.zip > target/MAGGuilds-4.0.26-source.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MAGGuilds-4.0.26
          path: |
            target/MAGGuilds-4.0.26.jar
            target/MAGGuilds-4.0.26-source.zip
            target/MAGGuilds-4.0.26.jar.sha256
            target/MAGGuilds-4.0.26-source.zip.sha256
            src/main/resources/config.yml
            src/main/resources/messages.yml
