name: Build MAGGuilds Incognito

on:
  push:
    branches: [main, 'build/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build with Maven
        run: mvn -B clean package
      - name: Generate checksums
        run: sha256sum target/MAGGuilds-Incognito-4.0.25.jar > target/MAGGuilds-Incognito-4.0.25.jar.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAGGuilds-Incognito-4.0.25
          path: |
            target/MAGGuilds-Incognito-4.0.25.jar
            target/MAGGuilds-Incognito-4.0.25.jar.sha256
            src/main/resources/config.yml
            src/main/resources/messages.yml
